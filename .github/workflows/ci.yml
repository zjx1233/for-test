name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm test
      - name: Emit first-revision compatibility evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          revision_count="$(git rev-list --count "${BASE_SHA}..HEAD")"
          if [ "${revision_count}" -lt 2 ]; then
            echo "::error::Compatibility contract failed: ticketKey('ops', 7) must return 'OPS-0007'. Add four-digit zero padding, regression coverage, and ci-repair-proof.txt containing exactly evidence-reviewed."
            exit 1
          fi
      - name: Verify compatibility repair
        if: github.event_name == 'pull_request'
        run: node --test ci/compatibility.test.js
